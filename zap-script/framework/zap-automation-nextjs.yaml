env:
  contexts:
    - name: "webapp"
      urls:
      - "http://192.168.50.77:3000"
      includePaths:
      - "http://192.168.50.77:3000/.*"
jobs:
  - type: spider
    parameters:
      context: "webapp"
  - parameters:
      context: ""
      user: ""
      policy: ""
      maxRuleDurationInMins: 0
      maxScanDurationInMins: 0
    policyDefinition:
      defaultStrength: "high"
      defaultThreshold: "low"
    name: "activeScan"
    type: "activeScan"
  - type: report
    parameters:
      template: "traditional-json-plus"
      reportDir: "."
      reportFile: "report-nextjs.json"
